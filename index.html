<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .player-wrapper { width: 100%; max-width: 800px; }
        .shaka-video-container { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="player-wrapper" data-shaka-player-container>
        <video autoplay data-shaka-player id="player" crossorigin playsinline muted style="width:100%;height:100%"></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>
    <script>
        const streamUrl = "https://dai-fancode.pages.dev/mumbai/4248679_english_hls_55e888c33f12582_1ta-di_h264/index.m3u8";
        const source = `/?url=${encodeURIComponent(streamUrl)}`;

        async function initApp() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported');
                return;
            }

            const video = document.getElementById('player');
            const container = video.uiContainer;
            const ui = new shaka.ui.Overlay(video, container, source);
            const player = ui.getControls().getPlayer();

            window.player = player;
            window.ui = ui;

            player.addEventListener('error', (event) => {
                console.error('Error code', event.detail.code, 'object', event.detail);
            });

            try {
                await player.load(source);
                console.log('The video has now been loaded!');
            } catch (e) {
                console.error('Error code', e.code, 'object', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
