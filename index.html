<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .player-wrapper { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <video id="player" controls crossorigin playsinline muted></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const video = document.getElementById('player');
        
        // Define your new stream and referer here
        const streamUrl = "https://xameleon.phantemlis.top/four/secure/0a76e947b73b1cf9bfc6e6adb373f315/1789277411/premium65/index.m3u8";
        const referer = "https://hamis.romponalis.st/premiumtv/daddy3.php?id=65";
        
        // Pass both to the Cloudflare Worker
        let source = `/?url=${encodeURIComponent(streamUrl)}`;
        if (referer) source += `&referer=${encodeURIComponent(referer)}`;

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30
            });

            hls.loadSource(source);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const player = new Plyr(video, {
                    autoplay: true,
                    controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen']
                });
                player.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = source;
            video.addEventListener('loadedmetadata', () => {
                const player = new Plyr(video, { autoplay: true });
                player.play();
            });
        }
    </script>
</body>
</html>
