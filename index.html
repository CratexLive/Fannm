<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricXCrate Live - Multi Stream</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050a0f; }
    </style>
<style type="text/css">* {user-select: auto !important; -webkit-user-select: auto !important;}</style></head>
<body>

    <cricxcrate-ui></cricxcrate-ui>

    <script>
class CricXCrateUI extends HTMLElement {
  constructor() {
    super();
    this._shadow = this.attachShadow({ mode: 'closed' });
    this.SENSITIVITY = 2.5;
    this.CONFIG = {
      telegramLink: "https://t.me/+xSqMXDXp78ZiOWQ1",
      playlistUrl: "https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.m3u",
      streamManifest: "",
      streamTitle: "Loading Matches..."
    };

    this.channels = [];
    this.currentChannelIndex = 0;
    this.isStreamUnlocked = false;
    this.lockTimer = null;
    this.PREVIEW_TIME = 5 * 60 * 1000;
    this.animationFrameId = null;
    this.stars = [];

    this.msgHandler = (e) => {
      if (e.data === 'cricxcrate-fs-enter') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.add('fs-active');
          try {
            if (rig.requestFullscreen) rig.requestFullscreen().catch(()=>{});
            else if (rig.webkitRequestFullscreen) rig.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
          } catch(err){}
        }
      } else if (e.data === 'cricxcrate-fs-exit') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.remove('fs-active');
          try {
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch(err){}
        }
      }

      if (e.data === 'cricxcrate-playing') {
        if (!this.isStreamUnlocked && !this.lockTimer) {
          this.lockTimer = setTimeout(() => this.triggerLock(), this.PREVIEW_TIME);
        }
      }
    };

    this.nativeFsHandler = () => {
       const rig = this._shadow.getElementById('playerContainer');
       if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (rig) rig.classList.remove('fs-active');
       }
    };
  }

  async connectedCallback() {
    this.checkUnlockStatus();
    await this.fetchChannels();
    await this.render();
    this.initWarpField();
    this.initThemeSwitching();
    this.initEventListeners();
    this.setupIframePlayer();

    window.addEventListener('message', this.msgHandler);
    document.addEventListener('fullscreenchange', this.nativeFsHandler);
    document.addEventListener('webkitfullscreenchange', this.nativeFsHandler);

    setTimeout(() => {
      const modal = this._shadow.getElementById('tgInitialModal');
      if (modal) modal.classList.add('show');
    }, 2000);
  }

  disconnectedCallback() {
    if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
    if (this.lockTimer) clearTimeout(this.lockTimer);
    window.removeEventListener('message', this.msgHandler);
    document.removeEventListener('fullscreenchange', this.nativeFsHandler);
    document.removeEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }

  async fetchChannels() {
    try {
      const res = await fetch(this.CONFIG.playlistUrl);
      const text = await res.text();
      const lines = text.split('\n');
      
      this.channels = [];
      let currentTitle = "";

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          if (parts.length > 1) {
            currentTitle = parts.slice(1).join(',').trim();
          }
        } else if (line && !line.startsWith('#')) {
          let cleanUrl = line.split('|')[0].trim();
          if (cleanUrl) {
            this.channels.push({
              title: currentTitle || `Match ${this.channels.length + 1}`,
              url: `/?url=${encodeURIComponent(cleanUrl)}`
            });
          }
          currentTitle = "";
        }
      }

      if (this.channels.length > 0) {
        this.CONFIG.streamManifest = this.channels[0].url;
        this.CONFIG.streamTitle = this.channels[0].title;
      }
    } catch (err) {
      this.channels = [{
        title: "Default Live Stream",
        url: `/?url=${encodeURIComponent("https://dai-fancode.pages.dev/mumbai/4248679_english_hls_55e888c33f12582_1ta-di_h264/index.m3u8")}`
      }];
      this.CONFIG.streamManifest = this.channels[0].url;
      this.CONFIG.streamTitle = this.channels[0].title;
    }
  }

  switchChannel(index) {
    if (this.channels[index]) {
      this.currentChannelIndex = index;
      this.CONFIG.streamManifest = this.channels[index].url;
      this.CONFIG.streamTitle = this.channels[index].title;
      
      const titleEl = this._shadow.getElementById('activeStreamTitle');
      if (titleEl) titleEl.textContent = this.CONFIG.streamTitle;

      this.setupIframePlayer();
    }
  }
  async render() {
    let optionsHtml = this.channels.map((ch, idx) => `
      <option value="${idx}" ${idx === this.currentChannelIndex ? 'selected' : ''}>${ch.title}</option>
    `).join('');

    this._shadow.innerHTML = `
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

      <style>
        :host {
          --primary-rgb: 0, 255, 204;
          --accent: rgb(var(--primary-rgb));
          --accent-glow: rgba(var(--primary-rgb), 0.45);
          --bg-pure: #050a0f; 
          --bg-card: rgba(12, 18, 28, 0.65);
          --border-glass: rgba(0, 255, 204, 0.12);
          --border-glass-bright: rgba(0, 255, 204, 0.3);
          --heading-dynamic: #ffffff;
          --text-main: #e0f2f1;
          --text-muted: #78909c;
          --text-dark: #455a64;
          --btn-main-bg: #ffffff;
          --btn-main-text: #050a0f;
          --player-shadow: 0 45px 120px -20px rgba(0, 255, 204, 0.2);
          display: block; position: relative; width: 100%; min-height: 100vh;
          background: radial-gradient(circle at 50% 0%, rgba(var(--primary-rgb), 0.1) 0%, transparent 60%), var(--bg-pure);
          color: var(--text-main); font-family: 'Manrope', sans-serif; overflow-x: hidden;
          font-size: clamp(14px, 0.8vw + 0.45rem, 22px); box-sizing: border-box;
        }

        :host([data-theme="light"]) {
          --primary-rgb: 0, 200, 180;
          --accent: #00c8b4;
          --accent-glow: rgba(0, 200, 180, 0.3);
          --bg-pure: #f0f7f7;
          --bg-card: rgba(255, 255, 255, 0.8);
          --border-glass: rgba(0, 0, 0, 0.08);
          --border-glass-bright: rgba(0, 0, 0, 0.2);
          --heading-dynamic: #000000;
          --text-main: #0a0f12;
          --text-muted: #546e7a;
          --text-dark: #90a4ae;
          --btn-main-bg: #091015;
          --btn-main-text: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        #warpGridCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; opacity: 0.8; }
        .container { width: min(1500px, 92vw); margin: 0 auto; padding: 0 0 clamp(40px, 6vw, 100px); position: relative; z-index: 10; }
        .nav { height: clamp(64px, 8.5vh, 96px); display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 50; }
        .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(18px, 2vw, 24px); font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: var(--heading-dynamic); }

        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .live-pill-badge { height: 34px; padding: 0 14px; display: flex; align-items: center; gap: 6px; background: var(--bg-card); border: 1px solid var(--border-glass); backdrop-filter: blur(12px); border-radius: 100px; color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; }
        .pulsing-live-dot { width: 6px; height: 6px; background: #ff2a2a; border-radius: 50%; box-shadow: 0 0 10px #ff2a2a; animation: liveSignal 1.5s ease-in-out infinite; }
        @keyframes liveSignal { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
        
        .nav-join-btn { height: 34px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 100px; background: var(--btn-main-bg); color: var(--btn-main-text); text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1px; transition: all 0.25s ease; }
        .nav-join-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); transform: translateY(-1px); }

        .hero { position: relative; padding: clamp(20px, 3vw, 40px) 0 clamp(10px, 2vw, 24px); display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        .hero-left h1 { font-family: 'Syne', sans-serif; font-size: clamp(28px, 5vw, 64px); line-height: 0.92; letter-spacing: -0.04em; font-weight: 900; text-transform: uppercase; }
        .hero-left h1 .accent-txt { color: var(--accent); background: linear-gradient(135deg, #00ffcc 0%, #0096ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .minimal-switcher { display: inline-flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-glass-bright); padding: 6px 14px; border-radius: 100px; backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .minimal-switcher span { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }
        .minimal-switcher select { background: transparent; color: var(--text-main); border: none; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; outline: none; cursor: pointer; padding-right: 10px; }
        .minimal-switcher select option { background: #0b131a; color: #fff; }

        .track-separator-beam { width: 100%; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, var(--border-glass) 45%, transparent 100%); margin-bottom: 18px; }

        .player-rig-box { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; overflow: hidden; border-radius: 18px; border: 1px solid var(--border-glass-bright); box-shadow: var(--player-shadow); }
        iframe#player { width: 100%; height: 100%; border: none; display: block; position: relative; z-index: 5; border-radius: inherit; }
        .player-rig-box.fs-active { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; max-width: none !important; max-height: none !important; z-index: 9999999 !important; border-radius: 0 !important; border: none !important; background: #000 !important; }
        
        .player-meta-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 2px 0; flex-wrap: wrap; }
        .stream-title-group { display: flex; flex-direction: column; gap: 3px; }
        .stream-title-group strong { font-family: 'Space Grotesk', sans-serif; font-size: clamp(14px, 1.2vw, 18px); font-weight: 700; }
        .stream-title-group span { font-family: 'Space Grotesk', sans-serif; color: var(--text-muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }

        .share-action-btn { height: 40px; padding: 0 20px; display: inline-flex; align-items: center; gap: 8px; border-radius: 100px; background: linear-gradient(135deg, var(--bg-card) 0%, rgba(var(--primary-rgb), 0.12) 100%); border: 1px solid var(--accent); color: var(--text-main); font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.25s ease; }
        .share-action-btn svg { width: 13px; height: 13px; stroke: var(--accent); stroke-width: 2.2; }
        .share-action-btn:hover { background: var(--accent); color: #000; transform: translateY(-1px); }
        .share-action-btn:hover svg { stroke: #000; }

        .community { margin-top: 60px; position: relative; }
        .community-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-glass); }
        .comm-tag { font-family: 'Space Grotesk', sans-serif; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .community-body { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 30px 0; }
        .comm-heading { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 4vw, 54px); line-height: 0.95; letter-spacing: -0.04em; font-weight: 700; }
        .comm-heading span { color: var(--text-dark); }
        
        .comm-btn-prime { height: 48px; padding: 0 28px; display: inline-flex; align-items: center; gap: 10px; border-radius: 100px; background: var(--btn-main-bg); color: var(--btn-main-text); text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1px; white-space: nowrap; transition: all 0.25s ease; }
        .comm-btn-prime:hover { background: var(--accent); color: #000; transform: translateY(-1px); }

        .footer { margin-top: 50px; border-top: 1px solid var(--border-glass); padding: 20px 0; display: flex; align-items: center; justify-content: space-between; color: var(--text-dark); font-family: 'Space Grotesk', sans-serif; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }

        .tg-modal-overlay { position: fixed; inset: 0; background: rgba(2, 4, 8, 0.9); backdrop-filter: blur(12px); z-index: 1000000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .tg-modal-overlay.show { opacity: 1; pointer-events: all; }
        .tg-modal-box { background: var(--bg-card); border: 1px solid var(--border-glass-bright); border-radius: 16px; padding: 36px; text-align: center; max-width: 400px; width: 90%; transform: scale(0.9) translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 30px 80px rgba(0,0,0,0.8); }
        .tg-modal-overlay.show .tg-modal-box { transform: scale(1) translateY(0); opacity: 1; }
        
        .tg-modal-icon { width: 64px; height: 64px; margin: 0 auto 18px; background: rgba(0, 255, 204, 0.1); border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0, 255, 204, 0.25); }
        .tg-modal-icon svg { width: 32px; height: 32px; fill: var(--accent); }
        .tg-modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px; }
        .tg-modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        .tg-modal-btn-join { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 10px; background: linear-gradient(135deg, #00ffcc 0%, #0096ff 100%); color: #000; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; cursor: pointer; margin-bottom: 10px; }
        .tg-modal-btn-joined { background: transparent; border: none; color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; padding: 6px; }
        .tg-modal-btn-joined:hover { color: var(--accent); }

        .theme-switch-deck { position: fixed; right: 20px; top: 20px; z-index: 900; background: var(--bg-card); border: 1px solid var(--border-glass-bright); border-radius: 100px; backdrop-filter: blur(20px); padding: 3px; display: flex; align-items: center; gap: 4px; }
        .mode-toggle-btn { height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 8px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; border-radius: 100px; cursor: pointer; transition: all 0.25s ease; }
        .mode-toggle-btn i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
        .mode-toggle-btn.active { background: var(--accent); color: #000; }
        .mode-toggle-btn.active i { background: #000; }

        @media (max-width: 680px) {
          .community-body { grid-template-columns: 1fr; gap: 16px; }
          .comm-btn-prime { width: 100%; justify-content: center; }
          .player-meta-bar { flex-direction: column; align-items: flex-start; }
          .share-action-btn { width: 100%; justify-content: center; }
        }
      </style>
      
      <canvas id="warpGridCanvas"></canvas>
      <div class="container">
        <header class="nav">
          <a class="brand" href="${this.CONFIG.telegramLink}" target="_blank" rel="noopener">
            <div class="brand-title">CRICXCRATE</div>
          </a>
          <div class="nav-actions">
            <div class="live-pill-badge"><i class="pulsing-live-dot"></i>ON AIR</div>
            <a class="nav-join-btn" href="${this.CONFIG.telegramLink}" target="_blank" rel="noopener">JOIN</a>
          </div>
        </header>

        <section class="hero">
          <div class="hero-left">
            <div class="hero-tag" style="font-family:'Space Grotesk';color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:6px;">LIVE BROADCAST</div>
            <h1>FANCODE <span class="accent-txt">STREAM</span></h1>
          </div>
          <div class="minimal-switcher">
            <span>Match</span>
            <select id="channelSelector">
              ${optionsHtml}
            </select>
          </div>
        </section>

        <main class="broadcast">
          <div class="track-separator-beam"></div>

          <div class="player-rig-box" id="playerContainer">
            <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
          </div>

          <div class="player-meta-bar">
            <div class="stream-title-group">
              <strong id="activeStreamTitle">${this.CONFIG.streamTitle}</strong>
              <span>CricxCrate Exclusive Access</span>
            </div>
            <button class="share-action-btn" id="btnShare">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
              <span id="shareBtnText">SHARE STREAM</span>
            </button>
          </div>
        </main>

        <section class="community">
          <div class="community-header"><div class="comm-tag">CRICXCRATE</div></div>
          <div class="community-body">
            <h2 class="comm-heading">Stay connected.<br><span>Never miss a match.</span></h2>
            <a class="comm-btn-prime" href="${this.CONFIG.telegramLink}" target="_blank" rel="noopener">JOIN COMMUNITY</a>
          </div>
        </section>

        <footer class="footer">
          <span>© 2026 <strong>CRICXCRATE</strong></span>
          <span>MULTI-STREAM SUITE PRO</span>
        </footer>
      </div>

      <div class="tg-modal-overlay" id="tgInitialModal">
        <div class="tg-modal-box">
          <div class="tg-modal-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.11.03-1.84 1.18-5.21 3.45-.49.33-.94.49-1.35.48-.45-.01-1.31-.25-1.95-.46-.79-.26-1.42-.4-1.36-.84.03-.23.35-.47.96-.73 3.77-1.64 6.29-2.73 7.55-3.25 3.59-1.49 4.33-1.75 4.81-1.76.11 0 .35.03.48.14.11.09.14.22.15.34-.01.07-.01.19-.02.26z"/></svg>
          </div>
          <h3 class="tg-modal-title">Join Channel</h3>
          <p class="tg-modal-desc">Join for streaming links</p>
          <a class="tg-modal-btn-join" id="tgJoinBtn" href="${this.CONFIG.telegramLink}" target="_blank" rel="noopener">JOIN CHANNEL</a>
          <button class="tg-modal-btn-joined" id="tgJoinedBtn">I've joined</button>
        </div>
      </div>

      <aside class="theme-switch-deck">
        <button class="mode-toggle-btn active" id="themeDarkBtn"><i></i> Obsidian</button>
        <button class="mode-toggle-btn" id="themeLightBtn"><i></i> Ceramic</button>
      </aside>
    `;
  }
  checkUnlockStatus() {
    const savedTime = localStorage.getItem('cricxcrate_unlocked_time');
    if (savedTime) {
      if (Date.now() - parseInt(savedTime, 10) < 24 * 60 * 60 * 1000) {
        this.isStreamUnlocked = true;
      } else {
        localStorage.removeItem('cricxcrate_unlocked_time');
      }
    }
  }

  triggerLock() {
    if (this.isStreamUnlocked) return;
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('cricxcrate-force-pause', '*');
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch(err){}
    this._shadow.getElementById('tgInitialModal').classList.add('show');
  }

  unlockStream() {
    localStorage.setItem('cricxcrate_unlocked_time', Date.now().toString());
    this.isStreamUnlocked = true;
    this._shadow.getElementById('tgInitialModal').classList.remove('show');
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('cricxcrate-force-play', '*');
  }

  initEventListeners() {
    const btnShare = this._shadow.getElementById("btnShare");
    const shareBtnText = this._shadow.getElementById("shareBtnText");
    const tgJoinBtn = this._shadow.getElementById("tgJoinBtn");
    const tgJoinedBtn = this._shadow.getElementById("tgJoinedBtn");
    const channelSelector = this._shadow.getElementById("channelSelector");

    tgJoinBtn.addEventListener("click", () => this.unlockStream());
    tgJoinedBtn.addEventListener("click", () => this.unlockStream());

    if (channelSelector) {
      channelSelector.addEventListener("change", (e) => {
        this.switchChannel(parseInt(e.target.value, 10));
      });
    }

    btnShare.addEventListener("click", async () => {
      const shareData = {
        title: "CRICXCRATE — Live Stream",
        text: "Watch live matches on CRICXCRATE!",
        url: window.location.href
      };
      try {
        if (navigator.share && /mobile|android|iphone|ipad|tablet/i.test(navigator.userAgent)) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          const originalText = shareBtnText.textContent;
          shareBtnText.textContent = "COPIED!";
          setTimeout(() => { shareBtnText.textContent = originalText; }, 1800);
        }
      } catch (err) {}
    });
  }

  setupIframePlayer() {
    const iframe = this._shadow.getElementById('player');
    const streamUrl = this.CONFIG.streamManifest;

    iframe.srcdoc = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <style>
          body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
          video { width: 100%; height: 100%; object-fit: contain; }
          .loader-overlay { position: absolute; inset: 0; background: #050a0f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 20; transition: opacity 0.4s ease; color: #fff; }
          .loader-overlay.hidden { opacity: 0; pointer-events: none; }
          .spinner { width: 36px; height: 36px; border: 3px solid rgba(0,255,204,0.2); border-top-color: #00ffcc; border-radius: 50%; animation: spin 0.8s linear infinite; }
          @keyframes spin { to { transform: rotate(360deg); } }
          .error-msg { font-size: 12px; color: #ff5252; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; display: none; text-align: center; padding: 0 20px; }
          .retry-btn { margin-top: 8px; padding: 6px 14px; background: #00ffcc; color: #000; border: none; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: none; }
          :root { --plyr-color-main: #00ffcc; --plyr-video-control-background-hover: rgba(0, 255, 204, 0.2); }
        </style>
        <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
        <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"><\/script>
      </head>
      <body>
        <div id="loader" class="loader-overlay">
          <div class="spinner" id="spinner"></div>
          <div id="statusText" style="font-size:11px;color:#78909c;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;">Loading Stream...</div>
          <div class="error-msg" id="errorMsg">Stream offline or connection failed</div>
          <button class="retry-btn" id="retryBtn" onclick="location.reload()">Retry Stream</button>
        </div>
        <video id="vid" controls crossorigin playsinline></video>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('vid');
            const source = '${streamUrl}';
            const loader = document.getElementById('loader');
            const spinner = document.getElementById('spinner');
            const statusText = document.getElementById('statusText');
            const errorMsg = document.getElementById('errorMsg');
            const retryBtn = document.getElementById('retryBtn');
            let playerInstance = null;
            
            function initPlyrAndOrientation() {
              playerInstance = new Plyr(video, { 
                autoplay: true,
                controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                fullscreen: { enabled: true, fallback: true, iosNative: true }
              });
              
              playerInstance.on('playing', () => {
                loader.classList.add('hidden');
                window.parent.postMessage('cricxcrate-playing', '*');
              });
              playerInstance.on('enterfullscreen', () => window.parent.postMessage('cricxcrate-fs-enter', '*'));
              playerInstance.on('exitfullscreen', () => window.parent.postMessage('cricxcrate-fs-exit', '*'));
              
              video.play().catch(()=>{});
            }

            window.addEventListener('message', (e) => {
              if (e.data === 'cricxcrate-force-pause' && playerInstance) playerInstance.pause();
              if (e.data === 'cricxcrate-force-play' && playerInstance) playerInstance.play();
            });

            if (Hls.isSupported()) {
              const hls = new Hls({ 
                startLevel: -1, 
                capLevelToPlayerSize: true, 
                autoLevelCapping: -1,
                maxBufferLength: 30, 
                maxMaxBufferLength: 60, 
                maxBufferSize: 60 * 1000 * 1000, 
                liveSyncDurationCount: 3, 
                liveMaxLatencyDurationCount: 10,
                enableWorker: true,
                lowLatencyMode: false, 
                capLevelOnFPSDrop: true 
              });
              
              hls.loadSource(source);
              hls.attachMedia(video);
              
              hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                initPlyrAndOrientation();
                if(data.levels.length > 1) {
                   const availableQualities = data.levels.map(l => l.height).sort((a, b) => b - a);
                   playerInstance.options.quality = {
                     default: availableQualities[0],
                     options: availableQualities,
                     forced: true,
                     onChange: (e) => { hls.currentLevel = data.levels.findIndex(l => l.height === e); }
                   };
                }
              });
              
              hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                  switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                      hls.startLoad();
                      break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                      hls.recoverMediaError();
                      break;
                    default:
                      spinner.style.display = 'none';
                      statusText.style.display = 'none';
                      errorMsg.style.display = 'block';
                      retryBtn.style.display = 'block';
                      hls.destroy();
                      break;
                  }
                }
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = source;
              video.addEventListener('loadedmetadata', () => initPlyrAndOrientation());
              video.addEventListener('error', () => {
                spinner.style.display = 'none';
                statusText.style.display = 'none';
                errorMsg.style.display = 'block';
                retryBtn.style.display = 'block';
              });
            }
          });
        <\/script>
      </body>
      </html>
    `;
  }

  initWarpField() {
    const canvas = this._shadow.getElementById('warpGridCanvas');
    const ctx = canvas.getContext('2d');
    this.stars = [];
    const starCount = Math.min(120, Math.floor(window.innerWidth / 12));
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < starCount; i++) {
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: (Math.random() * 24 + 10) * this.SENSITIVITY * 0.8,
        speed: (Math.random() * 2.5 + 1.2) * this.SENSITIVITY,
        alpha: Math.random() * 0.5 + 0.15
      });
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.2;
      this.stars.forEach(star => {
        ctx.strokeStyle = `rgba(0, 255, 204, ${star.alpha})`; 
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x + star.length, star.y);
        ctx.stroke();
        star.x += star.speed;
        if (star.x > canvas.width) {
          star.x = -star.length;
          star.y = Math.random() * canvas.height;
        }
      });
      this.animationFrameId = requestAnimationFrame(render);
    };
    render();
  }

  initThemeSwitching() {
    const darkBtn = this._shadow.getElementById("themeDarkBtn");
    const lightBtn = this._shadow.getElementById("themeLightBtn");
    const setTheme = (mode) => {
      if (mode === "dark") {
        this.removeAttribute("data-theme");
        darkBtn.classList.add("active");
        lightBtn.classList.remove("active");
      } else {
        this.setAttribute("data-theme", "light");
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
      }
    };
    darkBtn.addEventListener("click", () => setTheme("dark"));
    lightBtn.addEventListener("click", () => setTheme("light"));
  }
}

customElements.define('cricxcrate-ui', CricXCrateUI);
    </script>
