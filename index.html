<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .player-wrapper { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <video id="player" controls crossorigin playsinline muted></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const video = document.getElementById('player');
        const streamUrl = "https://dai-fancode.pages.dev/mumbai/4248679_english_hls_55e888c33f12582_1ta-di_h264/index.m3u8";
        
        const source = `/?url=${encodeURIComponent(streamUrl)}`;

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30,
                maxBufferLength: 60,
                maxMaxBufferLength: 120,
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 10,
                abrEwmaDefaultEstimate: 500000
            });

            hls.loadSource(source);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                const availableQualities = hls.levels.map((l) => l.height);
                
                const defaultOptions = {
                    autoplay: true,
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                    settings: ['quality', 'speed'],
                    quality: {
                        default: hls.currentLevel,
                        options: availableQualities,
                        forced: true,
                        onChange: (newQuality) => {
                            hls.levels.forEach((level, index) => {
                                if (level.height === newQuality) {
                                    hls.currentLevel = index;
                                }
                            });
                        }
                    }
                };

                hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
                    const player = window.player;
                    if (player && player.config.quality) {
                        player.config.quality.selected = hls.levels[data.level].height;
                    }
                });

                window.player = new Plyr(video, defaultOptions);
                window.player.play();
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = source;
            video.addEventListener('loadedmetadata', () => {
                const player = new Plyr(video, { autoplay: true });
                player.play();
            });
        }
    </script>
</body>
</html>
