<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Live Stream</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; }
    </style>
</head>
<body>

    <fancode-ui stream-url="/?url=https%3A%2F%2Fdai-fancode.pages.dev%2Fmumbai%2F4248679_english_hls_55e888c33f12582_1ta-di_h264%2Findex.m3u8"></fancode-ui>

    <script>
class FanCodeUI extends HTMLElement {
  static get observedAttributes() {
    return ['stream-url'];
  }

  constructor() {
    super();
    this._shadow = this.attachShadow({ mode: 'closed' });
    this.CONFIG = {
      telegramLink: "https://t.me/+xSqMXDXp78ZiOWQ1",
      streamManifest: this.getAttribute('stream-url') || "",
    };

    this.isStreamUnlocked = false;
    this.lockTimer = null;
    this.PREVIEW_TIME = 7 * 60 * 1000; // 7 minutes lock timer

    this.msgHandler = (e) => {
      if (e.data === 'fc-fs-enter') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.add('fs-active');
          try {
            if (rig.requestFullscreen) rig.requestFullscreen().catch(()=>{});
            else if (rig.webkitRequestFullscreen) rig.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
          } catch(err){}
        }
      } else if (e.data === 'fc-fs-exit') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.remove('fs-active');
          try {
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch(err){}
        }
      }

      if (e.data === 'fc-playing') {
        if (!this.isStreamUnlocked && !this.lockTimer) {
          this.lockTimer = setTimeout(() => this.triggerLock(), this.PREVIEW_TIME);
        }
      }
    };

    this.nativeFsHandler = () => {
       const rig = this._shadow.getElementById('playerContainer');
       if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (rig) rig.classList.remove('fs-active');
       }
    };
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name === 'stream-url' && oldValue !== newValue && newValue) {
      this.CONFIG.streamManifest = newValue;
      this.setupIframePlayer();
    }
  }

  async connectedCallback() {
    this.checkUnlockStatus();
    if (this.hasAttribute('stream-url')) {
      this.CONFIG.streamManifest = this.getAttribute('stream-url');
    }
    await this.render();
    this.initEventListeners();
    this.setupIframePlayer();

    window.addEventListener('message', this.msgHandler);
    document.addEventListener('fullscreenchange', this.nativeFsHandler);
    document.addEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }

  disconnectedCallback() {
    if (this.lockTimer) clearTimeout(this.lockTimer);
    window.removeEventListener('message', this.msgHandler);
    document.removeEventListener('fullscreenchange', this.nativeFsHandler);
    document.removeEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }

  async render() {
    this._shadow.innerHTML = `
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800;900&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">

      <style>
        :host {
          --fc-orange: #ff5500;
          --fc-orange-glow: rgba(255, 85, 0, 0.3);
          --fc-bg: #121212;
          --fc-card: #1c1c1c;
          --fc-border: rgba(255, 255, 255, 0.08);
          --fc-text: #ffffff;
          --fc-muted: #a0a0a0;
          display: block; width: 100%; min-height: 100vh;
          background: var(--fc-bg); color: var(--fc-text);
          font-family: 'Manrope', sans-serif; box-sizing: border-box;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        .container { width: min(1200px, 94vw); margin: 0 auto; padding: 20px 0 60px; }
        .nav { height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--fc-border); margin-bottom: 24px; }
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: var(--fc-text); text-decoration: none; text-transform: uppercase; }
        .brand span { color: var(--fc-orange); }
        .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(255, 85, 0, 0.15); border: 1px solid var(--fc-orange); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; color: var(--fc-orange); letter-spacing: 1px; }
        .dot { width: 6px; height: 6px; background: var(--fc-orange); border-radius: 50%; box-shadow: 0 0 8px var(--fc-orange); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .player-rig { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; border: 1px solid var(--fc-border); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        iframe#player { width: 100%; height: 100%; border: none; display: block; }
        .player-rig.fs-active { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; z-index: 999999 !important; border-radius: 0 !important; border: none !important; }

        /* Minimal Clean Popup */
        .modal-overlay { position: absolute; inset: 0; background: rgba(18, 18, 18, 0.88); backdrop-filter: blur(8px); z-index: 30; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-card { background: var(--fc-card); border: 1px solid var(--fc-border); border-radius: 16px; padding: 28px 20px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .modal-desc { font-size: 13px; color: var(--fc-muted); line-height: 1.4; margin-bottom: 20px; }
        
        .btn-join-primary { display: block; width: 100%; padding: 12px; background: var(--fc-orange); color: #fff; border: none; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; cursor: pointer; transition: filter 0.2s; margin-bottom: 10px; box-shadow: 0 4px 15px var(--fc-orange-glow); }
        .btn-join-primary:hover { filter: brightness(1.1); }
        
        .btn-joined-sub { background: transparent; border: none; color: var(--fc-muted); font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 4px; transition: color 0.2s; }
        .btn-joined-sub:hover { color: #fff; }

        .meta-bar { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
        .stream-info h2 { font-size: 16px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .stream-info p { font-size: 12px; color: var(--fc-muted); margin-top: 2px; }
      </style>
      <div class="container">
        <header class="nav">
          <a class="brand" href="${this.CONFIG.telegramLink}" target="_blank">FAN<span>CODE</span></a>
          <div class="live-badge"><div class="dot"></div>LIVE</div>
        </header>

        <main>
          <div class="player-rig" id="playerContainer">
            <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="true" webkitallowfullscreen="true"></iframe>
            
            <div class="modal-overlay" id="tgModal">
              <div class="modal-card">
                <h3 class="modal-title">Join For Streaming Links</h3>
                <p class="modal-desc">Preview ended. Join our Telegram channel to unlock continuous uninterrupted streaming.</p>
                <a class="btn-join-primary" id="btnJoinNow" href="${this.CONFIG.telegramLink}" target="_blank">JOIN NOW</a>
                <button class="btn-joined-sub" id="btnIHaveJoined">I've joined</button>
              </div>
            </div>
          </div>

          <div class="meta-bar">
            <div class="stream-info">
              <h2>FanCode Official Stream Feed</h2>
              <p>High Definition Broadcast</p>
            </div>
          </div>
        </main>
      </div>
    `;
  }

  checkUnlockStatus() {
    const savedTime = localStorage.getItem('fancode_unlocked_time');
    if (savedTime && Date.now() - parseInt(savedTime, 10) < 24 * 60 * 60 * 1000) {
      this.isStreamUnlocked = true;
    } else {
      localStorage.removeItem('fancode_unlocked_time');
    }
  }

  triggerLock() {
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('fc-force-pause', '*');
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    } catch(err){}
    this._shadow.getElementById('tgModal').classList.add('show');
  }

  unlockStream() {
    localStorage.setItem('fancode_unlocked_time', Date.now().toString());
    this.isStreamUnlocked = true;
    this._shadow.getElementById('tgModal').classList.remove('show');
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('fc-force-play', '*');
  }

  initEventListeners() {
    this._shadow.getElementById("btnJoinNow").addEventListener("click", () => {
      window.open(this.CONFIG.telegramLink, '_blank');
    });

    this._shadow.getElementById("btnIHaveJoined").addEventListener("click", () => {
      this.unlockStream();
    });
  }
  setupIframePlayer() {
    const iframe = this._shadow.getElementById('player');
    const source = this.CONFIG.streamManifest;

    iframe.srcdoc = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <style>
          body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
          video { width: 100%; height: 100%; object-fit: contain; }
          :root { --plyr-color-main: #ff5500; --plyr-video-control-background-hover: rgba(255, 85, 0, 0.2); }
        </style>
        <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
        <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"><\/script>
      </head>
      <body>
        <video id="vid" controls crossorigin playsinline></video>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('vid');
            const streamSrc = '${source}';
            let playerInstance = null;
            
            function initPlayer() {
              playerInstance = new Plyr(video, { 
                autoplay: true,
                controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed']
              });
              
              playerInstance.on('playing', () => window.parent.postMessage('fc-playing', '*'));
              playerInstance.on('enterfullscreen', () => window.parent.postMessage('fc-fs-enter', '*'));
              playerInstance.on('exitfullscreen', () => window.parent.postMessage('fc-fs-exit', '*'));
              
              video.play().catch(()=>{});
            }

            window.addEventListener('message', (e) => {
              if (e.data === 'fc-force-pause' && playerInstance) playerInstance.pause();
              if (e.data === 'fc-force-play' && playerInstance) playerInstance.play();
            });

            if (Hls.isSupported()) {
              const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
              hls.loadSource(streamSrc);
              hls.attachMedia(video);
              hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                initPlayer();
                if(data.levels.length > 1) {
                   const qualities = data.levels.map(l => l.height).sort((a, b) => b - a);
                   playerInstance.options.quality = {
                     default: qualities[0], options: qualities, forced: true,
                     onChange: (q) => { hls.currentLevel = data.levels.findIndex(l => l.height === q); }
                   };
                }
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = streamSrc;
              video.addEventListener('loadedmetadata', () => initPlayer());
            }
          });
        <\/script>
      </body>
      </html>
    `;
  }
}

customElements.define('fancode-ui', FanCodeUI);
    </script>
</body>
</html>
