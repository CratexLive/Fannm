<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        .controls-container { width: 100%; max-width: 800px; margin-bottom: 15px; display: flex; gap: 10px; padding: 0 10px; box-sizing: border-box; position: relative; z-index: 5; }
        .controls-container input { flex: 1; padding: 12px; border-radius: 6px; border: none; background: #222; color: white; outline: none; border: 1px solid #333; }
        .controls-container button { padding: 12px 24px; border-radius: 6px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        
        .player-wrapper { width: 100%; max-width: 800px; position: relative; z-index: 5; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        .watermark { position: absolute; top: 20px; right: 25px; z-index: 10; opacity: 0.8; pointer-events: none; color: white; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        
        .error-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center; color: #ff4d4d; font-size: 18px; font-weight: bold; }

        /* --- Floating Telegram Icon --- */
        .floating-tg {
            position: fixed; bottom: 25px; right: 25px;
            background: linear-gradient(135deg, #2AABEE, #229ED9);
            color: white; padding: 12px 18px; border-radius: 50px;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 5px 15px rgba(42, 171, 238, 0.4);
            z-index: 100; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .floating-tg:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(42, 171, 238, 0.6); }
        .floating-tg svg { width: 22px; height: 22px; fill: white; }

        /* --- Premium Pop-up --- */
        .premium-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .premium-overlay.show { opacity: 1; visibility: visible; }
        
        .premium-box {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid #d4af37; /* Premium Gold */
            border-radius: 16px; padding: 35px 25px; text-align: center;
            max-width: 360px; width: 90%;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
            transform: translateY(40px) scale(0.95);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .premium-overlay.show .premium-box { transform: translateY(0) scale(1); }
        
        .premium-box h2 { color: #d4af37; margin: 0 0 10px 0; font-size: 26px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .premium-box p { color: #aaa; margin: 0 0 25px 0; font-size: 14px; line-height: 1.6; }
        
        /* Big Join Button */
        .btn-join-large {
            display: block; width: 100%; box-sizing: border-box;
            background: linear-gradient(90deg, #d4af37, #fff2cd, #d4af37);
            background-size: 200% auto; color: #000; text-decoration: none;
            padding: 16px; border-radius: 10px; font-size: 18px; font-weight: 900;
            margin-bottom: 15px; border: none; cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            animation: shineText 3s infinite linear; transition: transform 0.2s;
        }
        .btn-join-large:active { transform: scale(0.97); }
        @keyframes shineText { to { background-position: 200% center; } }
        
        /* Small Joined Button */
        .btn-joined-small {
            background: transparent; border: none; color: #666; font-size: 13px;
            cursor: pointer; text-decoration: none; transition: color 0.3s;
            padding: 5px 10px;
        }
        .btn-joined-small:hover { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="controls-container">
        <input type="text" id="streamInput" placeholder="Paste .m3u8 URL here..." value="https://dai-fancode.pages.dev/mumbai/4248312_english_hls_72d930b34b31875_1ta-di_h264/index.m3u8">
        <button onclick="loadStream()">Play</button>
    </div>

    <div class="player-wrapper">
        <div class="watermark">CricXCrate</div>
        <div class="error-overlay" id="errorOverlay">Stream Offline / Reconnecting...</div>
        <video id="player" controls crossorigin playsinline muted></video>
    </div>

    <!-- Floating Telegram Button -->
    <a href="https://t.me/+tZiiKH2HsjwzMzI1" target="_blank" class="floating-tg">
        <svg viewBox="0 0 24 24">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.892-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        Join Telegram
    </a>

    <!-- Premium Pop-up -->
    <div class="premium-overlay" id="premiumPopup">
        <div class="premium-box">
            <h2>👑 Premium Feed</h2>
            <p>Join our Telegram for smooth, uninterrupted streams and exclusive updates!</p>
            <a href="https://t.me/+tZiiKH2HsjwzMzI1" target="_blank" class="btn-join-large">JOIN NOW</a>
            <button class="btn-joined-small" onclick="closePopup()">I've joined</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // Popup Logic with Lazy Delay
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                if (!localStorage.getItem("premiumJoined")) {
                    document.getElementById("premiumPopup").classList.add("show");
                }
            }, 2000); // 2-second lazy animation delay
        });

        function closePopup() {
            document.getElementById("premiumPopup").classList.remove("show");
            localStorage.setItem("premiumJoined", "true"); // Saves so it doesn't show again
        }

        // Player Logic
        const video = document.getElementById('player');
        const errorOverlay = document.getElementById('errorOverlay');
        const inputElement = document.getElementById('streamInput');
        const AUTH_KEY = "cricxcrate"; 
        
        let hls;
        let player;

        function initPlayer(resolutions) {
            if (player) player.destroy();
            player = new Plyr(video, {
                autoplay: true,
                keyboard: { focused: true, global: true },
                quality: {
                    default: resolutions.length > 0 ? resolutions[0] : null,
                    options: resolutions,
                    forced: true,
                    onChange: (newQuality) => {
                        if (hls) {
                            hls.levels.forEach((level, levelIndex) => {
                                if (level.height === newQuality) hls.currentLevel = levelIndex;
                            });
                        }
                    }
                },
                controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen']
            });
        }

        function loadStream() {
            const rawUrl = inputElement.value.trim();
            if (!rawUrl) return;

            const source = `/?url=${encodeURIComponent(rawUrl)}&key=${AUTH_KEY}`;
            errorOverlay.style.display = 'none';

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                
                hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
                hls.loadSource(source);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const availableQualities = data.levels.map(l => l.height).sort((a, b) => b - a);
                    initPlayer(availableQualities);
                    video.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                errorOverlay.innerText = "Network Error - Attempting to reconnect...";
                                errorOverlay.style.display = 'flex';
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                initPlayer([]);
                                hls.destroy();
                                errorOverlay.innerText = "Fatal Error - Stream unplayable";
                                errorOverlay.style.display = 'flex';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                initPlayer([]);
                video.addEventListener('loadedmetadata', () => { video.play().catch(() => {}); });
            }
        }

        loadStream();
    </script>
</body>
</html>
