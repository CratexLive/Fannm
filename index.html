    <script>
class FanCodeUI extends HTMLElement {
  static get observedAttributes() {
    return ['stream-url'];
  }

  constructor() {
    super();
    this._shadow = this.attachShadow({ mode: 'closed' });
    this.SENSITIVITY = 2.5;
    this.CONFIG = {
      telegramLink: "https://t.me/+xSqMXDXp78ZiOWQ1",
      streamManifest: this.getAttribute('stream-url') || "",
    };

    this.isStreamUnlocked = false;
    this.lockTimer = null;
    this.PREVIEW_TIME = 30 * 1000; // 30 seconds lock timer
    this.animationFrameId = null;
    this.stars = [];

    this.msgHandler = (e) => {
      if (e.data === 'fc-fs-enter') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.add('fs-active');
          try {
            if (rig.requestFullscreen) rig.requestFullscreen().catch(()=>{});
            else if (rig.webkitRequestFullscreen) rig.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
          } catch(err){}
        }
      } else if (e.data === 'fc-fs-exit') {
        const rig = this._shadow.getElementById('playerContainer');
        if (rig) {
          rig.classList.remove('fs-active');
          try {
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          } catch(err){}
        }
      }

      if (e.data === 'fc-playing') {
        if (!this.isStreamUnlocked && !this.lockTimer) {
          this.lockTimer = setTimeout(() => this.triggerLock(), this.PREVIEW_TIME);
        }
      }
    };

    this.nativeFsHandler = () => {
       const rig = this._shadow.getElementById('playerContainer');
       if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (rig) rig.classList.remove('fs-active');
       }
    };
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name === 'stream-url' && oldValue !== newValue && newValue) {
      this.CONFIG.streamManifest = newValue;
      this.setupIframePlayer();
    }
  }

  async connectedCallback() {
    this.checkUnlockStatus();
    if (this.hasAttribute('stream-url')) {
      this.CONFIG.streamManifest = this.getAttribute('stream-url');
    }
    await this.render();
    this.initWarpField();
    this.initThemeSwitching();
    this.initEventListeners();
    this.setupIframePlayer();

    window.addEventListener('message', this.msgHandler);
    document.addEventListener('fullscreenchange', this.nativeFsHandler);
    document.addEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }

  disconnectedCallback() {
    if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
    if (this.lockTimer) clearTimeout(this.lockTimer);
    window.removeEventListener('message', this.msgHandler);
    document.removeEventListener('fullscreenchange', this.nativeFsHandler);
    document.removeEventListener('webkitfullscreenchange', this.nativeFsHandler);
  }

  checkUnlockStatus() {
    const savedTime = localStorage.getItem('fancode_unlocked_time');
    if (savedTime) {
      if (Date.now() - parseInt(savedTime, 10) < 24 * 60 * 60 * 1000) {
        this.isStreamUnlocked = true;
      } else {
        localStorage.removeItem('fancode_unlocked_time');
      }
    }
  }

  triggerLock() {
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('fc-force-pause', '*');
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch(err){}
    this._shadow.getElementById('tgPremiumModal').classList.add('show');
  }

  unlockStream() {
    localStorage.setItem('fancode_unlocked_time', Date.now().toString());
    this.isStreamUnlocked = true;
    this._shadow.getElementById('tgPremiumModal').classList.remove('show');
    const iframe = this._shadow.getElementById('player');
    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage('fc-force-play', '*');
  }

  initEventListeners() {
    const btnShare = this._shadow.getElementById("btnShare");
    const shareBtnText = this._shadow.getElementById("shareBtnText");
    const joinModalBtn = this._shadow.getElementById("tgJoinModalBtn");
    const iHaveJoinedBtn = this._shadow.getElementById("tgIHaveJoinedBtn");

    joinModalBtn.addEventListener("click", () => {
      window.open(this.CONFIG.telegramLink, '_blank', 'noopener');
    });

    iHaveJoinedBtn.addEventListener("click", () => {
      this.unlockStream();
    });

    btnShare.addEventListener("click", async () => {
      const shareData = {
        title: "FANCODE — Live Stream",
        text: "Watch live matches on FANCODE!",
        url: window.location.href
      };
      try {
        if (navigator.share && /mobile|android|iphone|ipad|tablet/i.test(navigator.userAgent)) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          const originalText = shareBtnText.textContent;
          shareBtnText.textContent = "COPIED!";
          setTimeout(() => { shareBtnText.textContent = originalText; }, 1800);
        }
      } catch (err) {}
    });
  }
  initWarpField() {
    const canvas = this._shadow.getElementById('warpGridCanvas');
    const ctx = canvas.getContext('2d');
    this.stars = [];
    const starCount = Math.min(120, Math.floor(window.innerWidth / 12));
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < starCount; i++) {
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: (Math.random() * 24 + 10) * this.SENSITIVITY * 0.8,
        speed: (Math.random() * 2.5 + 1.2) * this.SENSITIVITY,
        alpha: Math.random() * 0.5 + 0.15
      });
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.2;
      this.stars.forEach(star => {
        ctx.strokeStyle = `rgba(255, 85, 0, ${star.alpha})`; 
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x + star.length, star.y);
        ctx.stroke();
        star.x += star.speed;
        if (star.x > canvas.width) {
          star.x = -star.length;
          star.y = Math.random() * canvas.height;
        }
      });
      this.animationFrameId = requestAnimationFrame(render);
    };
    render();
  }

  initThemeSwitching() {
    const darkBtn = this._shadow.getElementById("themeDarkBtn");
    const lightBtn = this._shadow.getElementById("themeLightBtn");
    const setTheme = (mode) => {
      if (mode === "dark") {
        this.removeAttribute("data-theme");
        darkBtn.classList.add("active");
        lightBtn.classList.remove("active");
      } else {
        this.setAttribute("data-theme", "light");
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
      }
    };
    darkBtn.addEventListener("click", () => setTheme("dark"));
    lightBtn.addEventListener("click", () => setTheme("light"));
  }

  setupIframePlayer() {
    const iframe = this._shadow.getElementById('player');
    const streamUrl = this.CONFIG.streamManifest;

    iframe.srcdoc = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <style>
          body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
          video { width: 100%; height: 100%; object-fit: contain; }
          :root { --plyr-color-main: #ff5500; --plyr-video-control-background-hover: rgba(255, 85, 0, 0.2); }
        </style>
        <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"><\/script>
        <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"><\/script>
      </head>
      <body>
        <video id="vid" controls crossorigin playsinline></video>
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('vid');
            const source = '${streamUrl}';
            let playerInstance = null;
            
            function initPlyrAndOrientation() {
              playerInstance = new Plyr(video, { 
                autoplay: true,
                controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                fullscreen: { enabled: true, fallback: true, iosNative: true }
              });
              
              playerInstance.on('playing', () => window.parent.postMessage('fc-playing', '*'));
              playerInstance.on('enterfullscreen', () => window.parent.postMessage('fc-fs-enter', '*'));
              playerInstance.on('exitfullscreen', () => window.parent.postMessage('fc-fs-exit', '*'));
              
              video.play().catch(()=>{});
            }

            window.addEventListener('message', (e) => {
              if (e.data === 'fc-force-pause' && playerInstance) playerInstance.pause();
              if (e.data === 'fc-force-play' && playerInstance) playerInstance.play();
            });

            if (Hls.isSupported()) {
              const hls = new Hls({ 
                startLevel: -1, 
                capLevelToPlayerSize: true, 
                autoLevelCapping: -1,
                maxBufferLength: 30, 
                maxMaxBufferLength: 60, 
                maxBufferSize: 60 * 1000 * 1000, 
                liveSyncDurationCount: 3, 
                liveMaxLatencyDurationCount: 10,
                enableWorker: true,
                lowLatencyMode: false, 
                capLevelOnFPSDrop: true 
              });
              
              hls.loadSource(source);
              hls.attachMedia(video);
              
              hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                initPlyrAndOrientation();
                if(data.levels.length > 1) {
                   const availableQualities = data.levels.map(l => l.height).sort((a, b) => b - a);
                   playerInstance.options.quality = {
                     default: availableQualities[0],
                     options: availableQualities,
                     forced: true,
                     onChange: (e) => { hls.currentLevel = data.levels.findIndex(l => l.height === e); }
                   };
                }
              });
              
              hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                  switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                      hls.startLoad();
                      break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                      hls.recoverMediaError();
                      break;
                    default:
                      hls.destroy();
                      break;
                  }
                }
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = source;
              video.addEventListener('loadedmetadata', () => initPlyrAndOrientation());
            }
          });
        <\/script>
      </body>
      </html>
    `;
  }
}

customElements.define('fancode-ui', FanCodeUI);
